name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'types/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/strapi

            echo "[deploy] Pulling latest"
            git pull origin main

            echo "[deploy] Installing production dependencies"
            cd backend
            if command -v corepack >/dev/null 2>&1; then
              export COREPACK_DEFAULT_TO_LATEST=0
              pnpm_cmd="corepack pnpm"
            else
              pnpm_cmd="pnpm"
            fi
            $pnpm_cmd install

            echo "[deploy] Building admin panel"
            NODE_OPTIONS=--max-old-space-size=2048 pnpm run build

            echo "[deploy] Updating systemd service"
            sudo cp /opt/strapi/backend/deploy/strapi.service /etc/systemd/system/strapi.service
            sudo systemctl daemon-reload

            echo "[deploy] Restarting Strapi"
            sudo systemctl restart strapi

            echo "[deploy] Healthcheck"
            sleep 5
            for i in $(seq 1 12); do
              curl -sSfI http://127.0.0.1:1337/admin > /dev/null 2>&1 && { echo "OK"; break; }
              [ "$i" -eq 12 ] && echo "WARN: healthcheck failed" || sleep 5
            done
